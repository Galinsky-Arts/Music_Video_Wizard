# Mirrors the live Render service (workspace "Galinsky Arts"):
# one free Docker web service. Background generation runs in the same service
# through the authenticated bounded-drain route (/api/internal/jobs/drain),
# woken on demand via JOB_EXECUTOR_URL (= this service's own origin).
# Paid generation providers are disabled ("none"); free/local analysis,
# imported media, assembly and FFmpeg rendering need no provider keys.
# Free web services do not support preDeployCommand; migrations run in
# `npm run start:production` (prisma migrate deploy && next start).
services:
  - type: web
    name: music-video-wizard-galinsky-arts
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: ASSET_STORAGE_DRIVER
        value: s3
      - key: ASSET_STORAGE_BUCKET
        sync: false
      - key: ASSET_STORAGE_ENDPOINT
        sync: false
      - key: ASSET_STORAGE_REGION
        value: us-east-1
      - key: ASSET_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: ASSET_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: ASSET_STORAGE_FORCE_PATH_STYLE
        value: "true"
      # Providers stay disabled until the owner supplies keys and opts in.
      - key: AUDIO_TRANSCRIPTION_PROVIDER
        value: none
      - key: TEXT_GENERATION_PROVIDER
        value: none
      - key: IMAGE_GENERATION_PROVIDER
        value: none
      - key: VIDEO_GENERATION_PROVIDER
        value: none
      - key: STABILITY_API_KEY
        sync: false
      - key: AUDIO_ANALYSIS_PYTHON
        value: python
      - key: AUDIO_ANALYSIS_FFMPEG
        value: ffmpeg
      - key: VIDEO_RENDER_FFMPEG
        value: ffmpeg
      - key: VIDEO_RENDER_FFPROBE
        value: ffprobe
      # Same-service executor via the drain route; small batches for 512 MB.
      - key: JOB_EXECUTOR_URL
        sync: false
      - key: JOB_DRAIN_SECRET
        sync: false
      - key: JOB_DRAIN_BATCH_SIZE
        value: "1"
      - key: JOB_WORKER_CONCURRENCY
        value: "1"
      - key: JOB_WORKSPACE_CONCURRENCY
        value: "1"
